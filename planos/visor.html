<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header><a href="index.html">← Planos</a><h1 id="titulo"></h1></header>
<main>
  <div class="botones" id="variantes"></div>
  <div class="rejilla">
    <div>
      <div class="tarjeta">
        <div id="plano"></div>
        <div class="capas">
          <label><input type="checkbox" id="verOriginal"> Superponer foto original</label>
          <label><input type="checkbox" id="verHumeda" checked> Zona de bajantes</label>
          <label><input type="checkbox" id="verMuebles" checked> Muebles</label>
          <label><input type="checkbox" id="verObras" checked> Muros a tirar/construir</label>
        </div>
        <p class="pequeno" id="descripcion"></p>
        <ul class="pequeno" id="notas"></ul>
      </div>
    </div>
    <div>
      <div class="tarjeta"><h2>Requisitos</h2><ul class="checks" id="checks"></ul></div>
      <div class="tarjeta"><h2>Obra de tabiquería</h2><div id="obras"></div></div>
      <div class="tarjeta"><h2>Superficies útiles (aprox.)</h2><table id="tabla"></table></div>
      <div class="tarjeta"><h2>Anuncio</h2><div id="anuncio"></div></div>
    </div>
  </div>
</main>
<script src="obras.js"></script>
<script src="visor.js"></script>
</body>
</html>
